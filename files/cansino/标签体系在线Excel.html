<head>

<title>康希诺 PCV13 · 标签体系（在线 Excel）</title>
<style>
:root{--ink:#18312B;--ink2:#2E4740;--mut:#7C8883;--celadon:#3F7A68;--gold:#B8934F;--line:#D8D2C2;--grid:#ECEAE2;--headbg:#F2EFE7;--paper:#F5F3ED;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:#FFFDF7}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand .t{font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .s{font-size:11px;color:var(--mut)}
.toolbar{margin-left:auto;display:flex;align-items:center;gap:10px}
.toolbar input{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:190px;background:#fff;outline:none}
.toolbar input:focus{border-color:var(--celadon)}
.toolbar .zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.toolbar .zoom button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink)}
.toolbar .zoom button:hover{background:var(--headbg)}
.gridwrap{flex:1;overflow:auto;position:relative;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%;font-family:var(--sans)}
th.corner{position:sticky;left:0;top:0;z-index:6;background:var(--headbg);border:1px solid var(--line);border-top:0;border-left:0;width:46px;min-width:46px}
th.colh{position:sticky;top:0;z-index:4;background:var(--headbg);border:1px solid var(--line);border-top:0;text-align:center;font-weight:600;font-size:11px;color:var(--mut);font-family:var(--mono);padding:6px 4px}
td.rowh{position:sticky;left:0;z-index:3;background:var(--headbg);border:1px solid var(--line);border-left:0;text-align:center;font-size:11px;color:var(--mut);font-family:var(--mono);padding:6px 4px;min-width:46px;width:46px}
td.cell{border:1px solid var(--grid);padding:7px 10px;vertical-align:top;white-space:pre-wrap;word-break:break-word;line-height:1.5;min-width:120px;max-width:420px;background:#fff}
td.cell.hl{background:#FFF4DC}
td.cell mark{background:#FFE9A8;border-radius:2px;padding:0 2px}
.sheetbar{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);background:#F2EFE7;padding:0 12px;overflow-x:auto}
.sheetbar .st{padding:9px 20px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line);color:var(--ink2);white-space:nowrap;background:transparent}
.sheetbar .st.on{background:#fff;color:var(--celadon);font-weight:700;box-shadow:inset 0 2px 0 var(--celadon)}
.statusbar{display:flex;justify-content:space-between;padding:7px 18px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);background:#FFFDF7}
</style>
</head>

var wb = XLSX.read(B64, {type:"base64"});
var cur = null, zoom = 1, cols = {};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function colW(ws, idx){
  if(ws["!cols"] && ws["!cols"][idx] && ws["!cols"][idx].wch){ return Math.min(420, Math.max(120, ws["!cols"][idx].wch*8.5)); }
  return cols[idx] || 150;
}
function render(name){
  var ws = wb.Sheets[name]; if(!ws) return;
  var ref = ws["!ref"] || "A1:A1";
  var rng = XLSX.utils.decode_range(ref);
  var table = document.getElementById("grid");
  var s = "";
  s += "<thead><tr><th class='corner'></th>";
  for(var c=rng.s.c; c<=rng.e.c; c++){ s += "<th class='colh' style='min-width:"+colW(ws,c)+"px'>"+XLSX.utils.encode_col(c)+"</th>"; }
  s += "</tr></thead><tbody>";
  for(var r=rng.s.r; r<=rng.e.r; r++){
    s += "<tr><td class='rowh'>"+(r+1)+"</td>";
    for(var c=rng.s.c; c<=rng.e.c; c++){
      var addr = XLSX.utils.encode_cell({r:r, c:c});
      var cell = ws[addr];
      var v = cell && cell.v != null ? cell.v : "";
      v = esc(v);
      if(typeof cell !== "undefined" && cell !== null){
        if(cell.v != null && (cell.t==="s"||cell.t==="n")){
          var hl = (cell.t==="n");
          s += "<td class='cell"+(hl?" hl":"")+"' style='min-width:"+colW(ws,c)+"px'>"+v+"</td>";
        } else {
          s += "<td class='cell' style='min-width:"+colW(ws,c)+"px'></td>";
        }
      } else {
        s += "<td class='cell' style='min-width:"+colW(ws,c)+"px'></td>";
      }
    }
    s += "</tr>";
  }
  s += "</tbody>";
  table.innerHTML = s;
  document.getElementById("stat").textContent = "工作表「"+name+"」 · 行 "+(rng.e.r-rng.s.r+1)+" × 列 "+(rng.e.c-rng.s.c+1);
}
function buildTabs(){
  var bar = document.getElementById("sheetbar"); bar.innerHTML="";
  wb.SheetNames.forEach(function(nm, i){
    var d = document.createElement("span");
    d.className = "st" + (i===0?" on":"");
    d.textContent = nm;
    d.onclick = function(){
      document.querySelectorAll(".st").forEach(function(x){x.classList.remove("on")});
      d.classList.add("on"); cur = nm; render(nm); applySearch();
    };
    bar.appendChild(d);
  });
}
function applySearch(){
  var kw = document.getElementById("q").value.trim().toLowerCase();
  var tds = document.querySelectorAll("td.cell");
  tds.forEach(function(td){
    td.innerHTML = td.getAttribute("data-raw")||td.textContent;
  });
  if(!kw){ return; }
  tds.forEach(function(td){
    var txt = (td.textContent||"").toLowerCase();
    if(txt.indexOf(kw)>=0){
      var h = td.textContent.replace(new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
      td.innerHTML = h;
      td.classList.add("hl");
    } else {
      td.classList.remove("hl");
    }
  });
  document.getElementById("stat").textContent = "找到包含「"+document.getElementById("q").value+"」的单元格";
}
function applyZoom(){
  var wrap = document.querySelector(".gridwrap");
  wrap.style.fontSize = (12.5*zoom)+"px";
  document.getElementById("zp").textContent = Math.round(zoom*100)+"%";
}
document.getElementById("q").addEventListener("input", applySearch);
document.getElementById("zm").onclick = function(){ zoom=Math.max(.6, zoom-.1); applyZoom(); };
document.getElementById("zp2").onclick = function(){ zoom=Math.min(1.6, zoom+.1); applyZoom(); };

// 预计算每列内容最大长度作为最小宽度
wb.SheetNames.forEach(function(nm){
  var ws = wb.Sheets[nm], ref = ws["!ref"]; if(!ref) return;
  var rng = XLSX.utils.decode_range(ref);
  for(var c=rng.s.c; c<=rng.e.c; c++){
    var mx = 0;
    for(var r=rng.s.r; r<=rng.e.r; r++){
      var cell = ws[XLSX.utils.encode_cell({r:r,c:c})];
      if(cell && cell.v != null){ var L=String(cell.v).length; if(L>mx) mx=L; }
    }
    if(!cols[c] || mx>cols[c]) cols[c] = Math.min(420, Math.max(120, mx*9));
  }
});
buildTabs(); render(wb.SheetNames[0]);
</script>
</body>
</html>
